<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Computer Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Gaming Computer Gallery</h1>

        <div id="image">
            Hover over an image below to display here.
        </div>

        <div class="gallery">
            <img src="shopping (1).avif"
                 alt="ROG gaming laptop"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="shopping (2).avif"
                 alt="TUF gaming laptop"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="shopping.avif"
                 alt="Gaming desktop computer"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images (1).jpg"
                 alt="Acer Nitro 5 gaming laptop"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images (2).jpg"
                 alt="Lenovo Legion gaming laptop"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images.jpg"
                 alt="Acer gaming laptop"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">
        </div>
    </main>

    <script src="hu.js"></script>
</body>
</html>
